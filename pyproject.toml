[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article-blueprint-os"
version = "0.1.0"
description = "Auditable journal-first corpus pipeline for computational cancer-omics research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ArticleBlueprintOS contributors"}]
dependencies = []

[project.scripts]
article-blueprint = "article_blueprint_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
article_blueprint_os = ["py.typed"]
